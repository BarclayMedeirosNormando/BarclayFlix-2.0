name: iptv_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.8.1+6

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Requisições HTTP para o Master Login (Google Apps Script) e Xtream Codes API
  http: ^1.2.2

  # Gerenciamento de estado
  provider: ^6.1.2

  # Armazenamento seguro das credenciais (usuário, senha, DNS do servidor)
  flutter_secure_storage: ^9.2.2

  # Gera o identificador único por instalação usado no vínculo de
  # dispositivo (device locking) do Master Login — ver DeviceIdService.
  uuid: ^4.5.1

  # Progresso de reprodução ("Continuar Assistindo"): dado não sensível,
  # escrito a cada ~10s durante a reprodução de VOD/episódio — usar
  # flutter_secure_storage aqui pagaria o custo de criptografia do
  # Keychain/Keystore/DPAPI a cada escrita frequente sem necessidade
  # nenhuma (não é credencial). Suporte oficial de primeira classe para
  # Android/Android TV/Windows, sem dependências transitivas problemáticas
  # (ao contrário do cached_network_image, já avaliado e descartado antes
  # por causa do sqflite — ver NetworkImageWithFallback).
  shared_preferences: ^2.3.3

  # Player de vídeo (Live TV, VOD e Séries) via libmpv — funciona igual em
  # Android, Android TV e Windows. media_kit_libs_video empacota os binários
  # nativos do libmpv para todas as plataformas suportadas.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Toggle de tela cheia da janela no Windows (PlayerScreen).
  window_manager: ^0.5.2

  # Tipografia (Inter, ver AppTheme) — self-hosted via os assets em
  # assets/fonts/ (ver seção "fonts" mais abaixo neste arquivo) e
  # `GoogleFonts.config.allowRuntimeFetching = false` (main.dart), então
  # NUNCA baixa fonte pela rede em tempo de execução: um app de IPTV não
  # pode depender disso pra abrir, principalmente em Android TV com rede
  # instável.
  google_fonts: ^6.2.1

  # Lê a versão/build number do app (do próprio pubspec.yaml, ver `version:`
  # acima) em runtime. Usado pela ServerSelectionScreen para exibir a versão
  # instalada no título "Bem-vindo, {nomeCliente} - v{versao}".
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Simula a passagem de tempo em testes (ex: timeout de rede) sem esperar
  # o tempo real transcorrer.
  fake_async: ^1.3.3

  # TestFlutterSecureStoragePlatform — fake em memória do
  # flutter_secure_storage usado por storage_service_test.dart, pra não
  # depender de plugin nativo (Keychain/Keystore/DPAPI) em `flutter_test`.
  flutter_secure_storage_platform_interface: ^1.1.2

  # Gera o ícone de instalação (Android + Windows) a partir de uma única
  # imagem-fonte (ver `flutter_launcher_icons:` abaixo) — `dart run
  # flutter_launcher_icons` escreve direto nos mipmap-*/ic_launcher.png do
  # Android e no .ico do Windows, então isso só roda sob demanda (branding),
  # não em todo build.
  flutter_launcher_icons: ^0.14.4

# Configuração do flutter_launcher_icons (ver dev_dependencies acima) — a
# imagem-fonte é a identidade visual "BarclayFlix 2.0" (assets/icon/
# app_icon.png, 1024x1024). icon_size: 256 (o máximo aceito) pro ícone do
# Windows ficar nítido em telas de alto DPI.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # Fundo decorativo usado pela extinta ProfilesScreen (removida por estar
  # fora do fluxo principal). Sem uso em lib/ hoje; mantido caso a LoginScreen
  # venha a adotar o mesmo fundo.
  assets:
    - assets/images/login_background_v2.jpg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

  # Inter — self-hosted (ver AppTheme, main.dart e o comentário da
  # dependência google_fonts acima). Um ÚNICO arquivo de fonte variável
  # (eixo `wght`) cobre todos os pesos usados no app: declarar várias
  # entradas de `weight` apontando pro MESMO arquivo é a forma documentada
  # do Flutter de usar fontes variáveis sem baixar um arquivo por peso.
  # Baixado de https://github.com/google/fonts (ofl/inter, licença OFL —
  # ver assets/fonts/Inter-OFL.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
